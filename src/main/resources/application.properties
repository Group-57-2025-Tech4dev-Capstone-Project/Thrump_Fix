spring.application.name=Thrump Fix
server.port=${PORT:8081}

# Database configuration - values come from Render environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/thrumpfix_db
spring.datasource.username=root
spring.datasource.password=Victored6#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MysqlDialect

# JWT Configuration - values come from environment variables
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION}

# Logging
logging.level.root=INFO
logging.level.com.WTFCapestone=DEBUG

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
