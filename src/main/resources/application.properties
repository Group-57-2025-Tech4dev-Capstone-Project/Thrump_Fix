spring.application.name=Thrump Fix
server.port=${PORT:8081}

# Database configuration - values come from Render environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - values come from environment variables
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION}

# Logging
logging.level.root=INFO
logging.level.com.WTFCapestone=DEBUG

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
